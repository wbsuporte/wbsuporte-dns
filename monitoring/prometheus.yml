global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: "dns-01"
    static_configs:
      - targets: ["dns-exporter-01:9107"]

  - job_name: "dns-02"
    static_configs:
      - targets: ["dns-exporter-02:9107"]

  - job_name: "dns-03"
    static_configs:
      - targets: ["dns-exporter-03:9107"]
