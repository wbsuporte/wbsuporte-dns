########################################################################
# UNBOUND RECURSIVO ISP - BASELINE 0 A ~10.000 ASSINANTES
#
# Perfil:
# - Sem Anycast
# - IPv4 + IPv6
# - DNSSEC no Unbound
# - Hyperlocal ROOT + ARPA
# - Cache de alta performance
# - Prefetch
# - Serve Stale / Serve Expired
# - Alta concorrência
# - Pi-hole opcional como frontend
# - Bloqueios judiciais/regulatórios preservados
#
# Referência para carga alta:
# - 8 vCPU
# - 16 GB RAM
#
########################################################################


server:

    ####################################################################
    # EXECUÇÃO
    ####################################################################

    directory: "/etc/unbound"

    username: "unbound"

    pidfile: "/run/unbound.pid"

    # Container já fornece isolamento.
    chroot: ""


    ####################################################################
    # PORTA DNS
    ####################################################################

    port: 53


    ####################################################################
    # INTERFACES DE ESCUTA
    #
    # Em container, a interface de escuta normalmente é a que o Docker
    # expõe ao host. Para funcionar sem dependência de variáveis externas,
    # utilizamos bind em todos os endereços relevantes do contêiner.
    ####################################################################

    interface: 0.0.0.0

    interface: ::0

    interface-automatic: no


    ####################################################################
    # INTERFACES DE SAÍDA
    #
    # Não fixamos IPs de saída no container, pois a interface de saída
    # costuma ser definida automaticamente pelo Docker/Kernel. Em ambientes
    # reais, pode ser ajustada para endereços públicos específicas.
    ####################################################################

    # outgoing-interface: 203.0.113.10
    # outgoing-interface: 2001:db8::10


    ####################################################################
    # PROTOCOLOS
    ####################################################################

    do-ip4: yes

    do-ip6: yes

    do-udp: yes

    do-tcp: yes


    ####################################################################
    # CPU
    #
    # Deve acompanhar número de vCPU.
    #
    # 8 vCPU = 8
    #
    # Se algum servidor tiver:
    #
    # 4 vCPU -> use 4
    # 8 vCPU -> use 8
    # 16 vCPU -> use 16
    ####################################################################

    num-threads: 12


    ####################################################################
    # SO_REUSEPORT
    #
    # Em Linux melhora distribuição UDP entre as threads.
    ####################################################################

    so-reuseport: yes


    ####################################################################
    # SLABS
    #
    # NÃO definimos manualmente:
    #
    # msg-cache-slabs
    # rrset-cache-slabs
    # infra-cache-slabs
    # key-cache-slabs
    #
    # Unbound atual calcula automaticamente potência de 2 próxima
    # ao número de threads.
    ####################################################################


    ####################################################################
    # RECURSÕES SIMULTÂNEAS
    #
    # Perfil de alta capacidade com libevent.
    #
    # outgoing-range aproximadamente 2x
    # num-queries-per-thread.
    ####################################################################

    outgoing-range: 8192

    num-queries-per-thread: 4096


    ####################################################################
    # WAIT LIMIT
    #
    # Muito importante principalmente com:
    #
    # CLIENTES -> PI-HOLE -> UNBOUND
    #
    # O Unbound enxerga muitas consultas vindas do IP do Pi-hole.
    #
    # Default atual é somente 1000 respostas aguardando recursão
    # por IP.
    #
    # Seu Pi-hole usa dns-forward-max=4096.
    #
    # 8192 deixa margem.
    ####################################################################

    wait-limit: 8192

    wait-limit-cookie: 16384


    ####################################################################
    # TCP DNS
    #
    # DNS também usa TCP para:
    #
    # DNSSEC
    # respostas truncadas
    # respostas grandes
    # fallback UDP -> TCP
    #
    # Valores são POR THREAD.
    ####################################################################

    outgoing-num-tcp: 512

    incoming-num-tcp: 1024


    ####################################################################
    # UDP SOCKET BUFFERS
    #
    # Ajuda durante rajadas.
    #
    # O Linux também será ajustado para aceitar 8 MB.
    ####################################################################

    so-rcvbuf: 8m

    so-sndbuf: 8m


    ####################################################################
    # UDP CONNECT
    #
    # Mitigação atual do Unbound contra side-channel ICMP.
    ####################################################################

    udp-connect: yes


    ####################################################################
    # EDNS
    #
    # 1232 reduz fragmentação principalmente com:
    #
    # IPv6
    # DNSSEC
    ####################################################################

    edns-buffer-size: 1232

    max-udp-size: 1232


    ####################################################################
    # MESSAGE CACHE
    #
    # Respostas DNS completas.
    ####################################################################

    msg-cache-size: 512m


    ####################################################################
    # RRSET CACHE
    #
    # Aproximadamente 2x MESSAGE CACHE.
    #
    # Sua configuração antiga estava:
    #
    # MSG   512 MB
    # RRSET 128 MB
    #
    # O correto para performance é aproximadamente:
    #
    # MSG   512 MB
    # RRSET   1 GB
    ####################################################################

    rrset-cache-size: 1g


    ####################################################################
    # DNSSEC KEY CACHE
    ####################################################################

    key-cache-size: 128m


    ####################################################################
    # NEGATIVE CACHE
    #
    # NSEC / NSEC3 / NXDOMAIN.
    ####################################################################

    neg-cache-size: 64m


    ####################################################################
    # INFRASTRUCTURE CACHE
    #
    # Guarda informações sobre servidores autoritativos:
    #
    # RTT
    # EDNS
    # lameness
    # estado dos servidores
    #
    # Default = 10.000.
    ####################################################################

    infra-cache-numhosts: 100000


    ####################################################################
    # TTL MÍNIMO
    #
    # NÃO usamos 3600.
    #
    # Queremos respeitar TTL definido pelo domínio.
    #
    # Isso evita problemas com:
    #
    # CDN
    # bancos
    # failover
    # serviços dinâmicos
    ####################################################################

    cache-min-ttl: 60


    ####################################################################
    # TTL MÁXIMO
    #
    # No máximo 24 horas.
    ####################################################################

    cache-max-ttl: 86400


    ####################################################################
    # CACHE NEGATIVO
    #
    # Limita NXDOMAIN / NODATA em cache a no máximo 1 hora.
    #
    # O TTL real ainda depende do SOA recebido da zona.
    ####################################################################

    cache-max-negative-ttl: 3600


    ####################################################################
    # TTL ENTREGUE AO CLIENTE
    #
    # Mantém TTL decrementando normalmente.
    ####################################################################

    serve-original-ttl: no


    ####################################################################
    # PREFETCH
    #
    # Registro popular chegando ao fim do TTL:
    #
    # CLIENTE
    #    |
    #    +-> recebe cache
    #
    # UNBOUND
    #    |
    #    +-> atualiza em background
    #
    # Mantém domínios populares quentes.
    ####################################################################

    prefetch: yes


    ####################################################################
    # PREFETCH DNSSEC
    #
    # Antecipação de DNSKEY.
    #
    # Reduz latência de validação DNSSEC.
    ####################################################################

    prefetch-key: yes


    ####################################################################
    # SERVE STALE / SERVE EXPIRED
    #
    # RFC 8767.
    #
    # Imagine:
    #
    # registro expirou
    #      |
    #      +-> Unbound tenta buscar novo
    #
    # autoritativo não responde
    #      |
    #      +-> existe cópia stale recente?
    #               |
    #               +-> entrega stale
    #
    # Evita SERVFAIL desnecessário para cliente.
    ####################################################################

    serve-expired: yes


    ####################################################################
    # Pode usar stale por no máximo um dia.
    ####################################################################

    serve-expired-ttl: 86400


    ####################################################################
    # TTL da resposta stale.
    ####################################################################

    serve-expired-reply-ttl: 30


    ####################################################################
    # Primeiro tenta resolver normalmente por 1,8 segundo.
    #
    # Só depois considera stale.
    #
    # Isso é muito importante para não priorizar informação velha.
    ####################################################################

    serve-expired-client-timeout: 1800


    ####################################################################
    # NÃO prolongar stale indefinidamente.
    ####################################################################

    serve-expired-ttl-reset: no


    ####################################################################
    # TIMEOUT PARA RESPOSTAS AGUARDANDO RECURSÃO
    #
    # Deve ser um pouco maior que os 1800 ms acima.
    ####################################################################

    discard-timeout: 1900


    ####################################################################
    # MÓDULOS
    #
    # respip
    #     permite RPZ / response policy.
    #
    # validator
    #     DNSSEC.
    #
    # iterator
    #     recursão.
    #
    # Também deixa preparado para bloqueios judiciais via RPZ.
    ####################################################################

    module-config: "respip validator iterator"


    ####################################################################
    # DNSSEC HARDENING
    ####################################################################

    harden-dnssec-stripped: yes

    harden-glue: yes

    harden-below-nxdomain: yes


    ####################################################################
    # NÃO habilitar harden-referral-path.
    #
    # Gera consultas extras e pode prejudicar performance.
    ####################################################################

    harden-referral-path: no


    ####################################################################
    # NÃO usar harden-algo-downgrade.
    #
    # O próprio manual alerta que pode quebrar DNSSEC de algumas
    # configurações multi-signer.
    ####################################################################

    harden-algo-downgrade: no


    ####################################################################
    # LIMPEZA DNSSEC
    ####################################################################

    val-clean-additional: yes


    ####################################################################
    # DNSSEC BOGUS TEM QUE FALHAR
    #
    # Não permitir assinatura inválida.
    ####################################################################

    val-permissive-mode: no

    val-log-level: 1


    ####################################################################
    # TRUST ANCHOR
    #
    # IMPORTANTE:
    #
    # Como você usa um arquivo único, o auto-trust-anchor-file fica aqui.
    #
    # Isso evita duplicidade com anchors para "." em outros módulos.
    ####################################################################

    auto-trust-anchor-file: "/var/lib/unbound/root.key"


    ####################################################################
    # QNAME MINIMIZATION
    #
    # Boa prática KINDNS.
    ####################################################################

    qname-minimisation: yes


    ####################################################################
    # NÃO STRICT
    #
    # O próprio Unbound alerta que strict=yes pode tornar muitos
    # domínios incompatíveis.
    #
    # Prioridade:
    #
    # segurança + compatibilidade.
    ####################################################################

    qname-minimisation-strict: no


    ####################################################################
    # AGGRESSIVE NSEC
    #
    # Aproveita NSEC/NSEC3 para sintetizar algumas respostas
    # NXDOMAIN sem sair novamente para a Internet.
    #
    # Muito útil contra nomes aleatórios.
    ####################################################################

    aggressive-nsec: yes


    ####################################################################
    # RESPOSTAS MÍNIMAS
    #
    # Evita authority/additional desnecessário.
    #
    # Menos bytes
    # menos fragmentação
    # menos TCP fallback
    ####################################################################

    minimal-responses: yes


    ####################################################################
    # RRSET ROUND ROBIN
    ####################################################################

    rrset-roundrobin: yes


    ####################################################################
    # CONSULTAS ANY
    #
    # Restringe ANY.
    #
    # Não interfere com navegação normal usando:
    #
    # A
    # AAAA
    # CNAME
    # HTTPS
    # SVCB
    # MX
    # TXT
    # SRV
    # NS
    # PTR
    # DNSKEY
    ####################################################################

    deny-any: yes


    ####################################################################
    # UNWANTED REPLIES
    #
    # NÃO usar seu antigo:
    #
    # 10000
    #
    # Quando atinge o limite o Unbound executa ação defensiva e
    # limpa RRSET + MSG cache.
    #
    # 10 milhões é o valor sugerido pelo próprio manual.
    ####################################################################

    unwanted-reply-threshold: 10000000


    ####################################################################
    # NÃO CONSULTAR LOCALHOST COMO AUTORITATIVO EXTERNO
    #
    # Hyperlocal agora é interno usando auth-zone.
    ####################################################################

    do-not-query-localhost: yes


    ####################################################################
    # RATE LIMIT RECURSIVO
    #
    # Desabilitado.
    #
    # Não quero criar SERVFAIL/drop em cliente legítimo.
    #
    # Abuso grosseiro deve ser tratado no Huawei.
    ####################################################################

    ratelimit: 0

    ip-ratelimit: 0


    ####################################################################
    # ACL
    #
    # DEFAULT:
    #
    # REFUSE qualquer origem.
    #
    # Depois liberamos somente suas redes.
    ####################################################################

    access-control: 0.0.0.0/0 refuse

    access-control: ::/0 refuse


    ####################################################################
    # LOOPBACK
    ####################################################################

    access-control: 127.0.0.0/8 allow

    access-control: ::1/128 allow


    ####################################################################
    # RFC1918
    ####################################################################

    access-control: 10.0.0.0/8 allow

    access-control: 172.16.0.0/12 allow

    access-control: 192.168.0.0/16 allow

    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 100.64.0.0/10


    ####################################################################
    # RFC6598 / CGNAT
    ####################################################################

    access-control: 100.64.0.0/10 allow


    ####################################################################
    # PREFIXOS IPv4 DO PROVEDOR
    #
    # Em ambiente genérico, mantemos ACLs funcionais e documentadas.
    # Em produção, estes prefixos devem ser substituídos pelos blocos
    # reais do provedor.
    ####################################################################

    # access-control: 181.0.0.0/8 allow
    # access-control: 177.0.0.0/8 allow
    # access-control: 190.0.0.0/8 allow
    # access-control: 200.0.0.0/8 allow
    # access-control: 201.0.0.0/8 allow


    ####################################################################
    # PREFIXOS IPv6 DO PROVEDOR
    ####################################################################

    # access-control: 2804:xxxx::/32 allow
    # access-control: 2a00:xxxx::/32 allow
    # access-control: 2a01:xxxx::/32 allow
    # access-control: 2a02:xxxx::/32 allow
    # access-control: 2a03:xxxx::/32 allow


    ####################################################################
    # NÃO EXPOR INFORMAÇÕES DO SERVIDOR
    ####################################################################

    hide-identity: yes

    hide-version: yes

    hide-trustanchor: yes


    ####################################################################
    # LOG
    #
    # PRODUÇÃO:
    #
    # NÃO registrar cada query.
    ####################################################################

    verbosity: 1

    use-syslog: no

    logfile: "/var/lib/unbound/unbound.log"

    log-time-ascii: yes

    log-servfail: yes

    log-queries: no

    log-replies: no


    ####################################################################
    # ESTATÍSTICAS
    #
    # Necessárias para:
    #
    # unbound-control
    # Zabbix
    # Grafana
    ####################################################################

    statistics-interval: 0

    statistics-cumulative: no

    extended-statistics: yes


    ####################################################################
    # ROOT HINTS
    #
    # O arquivo está no volume de dados do contêiner, não no diretório
    # somente de configuração.
    ####################################################################

    root-hints: "/var/lib/unbound/root.hints"



########################################################################
# HYPERLOCAL ROOT
#
# O próprio Unbound mantém uma cópia local da zona ".".
#
# Não precisamos mais de NSD separado.
#
# for-downstream=no
#
#     não transforma o resolver em root autoritativo para cliente.
#
# for-upstream=yes
#
#     usa a cópia local internamente durante recursão.
#
# fallback-enabled=yes
#
#     se a cópia local apresentar problema:
#
#     UNBOUND -> ROOTS DA INTERNET
#
# portanto Hyperlocal não se torna ponto único de falha.
########################################################################

auth-zone:

    name: "."


    ####################################################################
    # SERVIDORES QUE PERMITEM TRANSFERÊNCIA DA ROOT ZONE
    #
    # Prefiro hostname em vez dos IPs antigos fixos do material do
    # curso, porque endereços podem ser atualizados.
    ####################################################################

    master: "b.root-servers.net"

    master: "c.root-servers.net"

    master: "d.root-servers.net"

    master: "f.root-servers.net"

    master: "g.root-servers.net"

    master: "k.root-servers.net"

    master: "lax.xfr.dns.icann.org"

    master: "iad.xfr.dns.icann.org"


    ####################################################################
    # FALLBACK
    #
    # ESSENCIAL PARA DISPONIBILIDADE.
    ####################################################################

    fallback-enabled: yes


    ####################################################################
    # HYPERLOCAL
    ####################################################################

    for-downstream: no

    for-upstream: yes


    ####################################################################
    # ARQUIVO LOCAL
    ####################################################################

    zonefile: "/var/lib/unbound/root.zone"



########################################################################
# HYPERLOCAL ARPA
#
# Mantém localmente a infraestrutura da zona ARPA.
########################################################################

auth-zone:

    name: "arpa."


    ####################################################################
    # SERVIDORES ICANN DE TRANSFERÊNCIA
    ####################################################################

    master: "lax.xfr.dns.icann.org"

    master: "iad.xfr.dns.icann.org"


    ####################################################################
    # NÃO DEIXAR ARPA LOCAL SE TORNAR PONTO DE FALHA
    ####################################################################

    fallback-enabled: yes


    ####################################################################
    # Usado somente internamente na recursão.
    ####################################################################

    for-downstream: no

    for-upstream: yes


    ####################################################################
    # ARQUIVO LOCAL
    ####################################################################

    zonefile: "/var/lib/unbound/arpa.zone"



########################################################################
# REMOTE CONTROL
#
# unbound-control
# Zabbix
# monitoramento
#
# TCP/8953 deve permanecer protegido.
########################################################################

remote-control:

    control-enable: yes

    control-interface: 127.0.0.1

    control-interface: /run/unbound.ctl

    control-port: 8953

    server-key-file: "/etc/unbound/unbound_server.key"

    server-cert-file: "/etc/unbound/unbound_server.pem"

    control-key-file: "/etc/unbound/unbound_control.key"

    control-cert-file: "/etc/unbound/unbound_control.pem"